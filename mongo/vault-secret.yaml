# VSO logs into Vault as this account - Vault's "mongo" role allows only this one
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-reader
  namespace: mongodb
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: vault
  namespace: mongodb
spec:
  address: http://vault.vault.svc.cluster.local:8200
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault
  namespace: mongodb
spec:
  vaultConnectionRef: vault
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: mongo
    serviceAccount: vault-reader
    audiences:
      - vault
---
# copies secret/mongo from Vault into the Kubernetes Secret "mongo-password" (key: password)
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: mongo-password
  namespace: mongodb
spec:
  vaultAuthRef: vault
  mount: secret
  type: kv-v2
  path: mongo
  refreshAfter: 1h
  destination:
    name: mongo-password
    create: true