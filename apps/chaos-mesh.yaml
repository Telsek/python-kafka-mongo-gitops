# Chaos Mesh - breaks things on purpose (kill a Kafka broker) to prove the shop survives
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chaos-mesh
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.chaos-mesh.org
    chart: chaos-mesh
    targetRevision: 2.8.4
    helm:
      valuesObject:
        chaosDaemon:
          # EKS nodes run containerd, not Docker
          runtime: containerd
          socketPath: /run/containerd/containerd.sock
  destination:
    server: https://kubernetes.default.svc
    namespace: chaos-mesh
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true # don't overwrite the fields below on sync
  # the chart makes new random certs on every render -> without this ArgoCD resyncs and restarts the controller in a loop
  ignoreDifferences:
    - kind: Secret
      namespace: chaos-mesh
      jsonPointers:
        - /data
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    - group: apps
      kind: Deployment
      namespace: chaos-mesh
      jsonPointers:
        - /spec/template/metadata/annotations