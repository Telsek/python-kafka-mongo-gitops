# SigNoz - stores and shows logs, metrics and traces (ClickHouse is its database)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: signoz
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.signoz.io
    chart: signoz
    targetRevision: 0.135.0
    helm:
      valuesObject:
        global:
          storageClass: gp3
        clickhouse:
          persistence:
            size: 10Gi
        signoz:
          env:
            # create the admin + organization on startup (no UI signup) - collectors need the org
            signoz_user_root_enabled: true
            signoz_user_root_email: admin@mansuraforecast.online
            signoz_user_root_org_name: leaky-pipeline
            signoz_user_root_password:
              valueFrom:
                secretKeyRef:
                  name: signoz-root # made by VSO from Vault
                  key: password
  destination:
    server: https://kubernetes.default.svc
    namespace: signoz
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true