# same as Mongo: VSO copies secret/signoz from Vault into the Secret "signoz-root"
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-reader
  namespace: signoz
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: vault
  namespace: signoz
spec:
  address: http://vault.vault.svc.cluster.local:8200
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault
  namespace: signoz
spec:
  vaultConnectionRef: vault
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: signoz
    serviceAccount: vault-reader
    audiences:
      - vault
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: signoz-root
  namespace: signoz
spec:
  vaultAuthRef: vault
  mount: secret
  type: kv-v2
  path: signoz
  refreshAfter: 1h
  destination:
    name: signoz-root
    create: true