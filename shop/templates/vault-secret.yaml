# VSO copies secret/mongo from Vault into the Secret "mongo-password" in this namespace
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-reader
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: vault
spec:
  address: http://vault.vault.svc.cluster.local:8200
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault
spec:
  vaultConnectionRef: vault
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: shop
    serviceAccount: vault-reader
    audiences:
      - vault
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: mongo-password
spec:
  vaultAuthRef: vault
  mount: secret
  type: kv-v2
  path: mongo
  refreshAfter: 1h
  destination:
    name: mongo-password
    create: true